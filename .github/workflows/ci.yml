name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: lint, typecheck, unit, invariants, attacks (replay)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AGENT_MODE: REPLAY
      NODE_ENV: test
      FX_OFFLINE: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Matches "packageManager" in package.json (bun@1.4.0).
          bun-version: "1.4.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate throwaway .env
        run: bun run env:setup

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit, invariant and attack tests
        run: bun run test

      - name: Migrate and seed a fresh database
        run: bun run db:migrate && bun run seed

      - name: Verify ledger hash chain
        run: bun run ledger:verify
